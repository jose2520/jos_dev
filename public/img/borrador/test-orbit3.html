<!DOCTYPE html>
<html>
<head>
<style>
.hero-orbit {
  position: absolute; width: 600px; height: 600px; left: 50%; top: 50%;
  transform: translate(-50%, -50%) rotate(-20deg) scaleY(0.3); 
  border: 1px solid red;
}
.orbit-ring {
  position: absolute; width: 100%; height: 100%;
  border-radius: 50%; border: 1px dashed blue;
  animation: rotate 10s linear infinite;
}
@keyframes rotate { 100% { transform: rotate(360deg); } }

.orbit-icon {
  position: absolute; width: 50px; height: 50px;
  background: green; color: white;
  left: 50%; top: 50%;
  animation: counter-rotate 10s linear infinite;
}
@keyframes counter-rotate { 
  0% { transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) rotate(0deg) scaleY(3.3333) rotate(20deg); }
  100% { transform: translate(-50%, -50%) rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) rotate(-360deg) scaleY(3.3333) rotate(20deg); } 
}
</style>
</head>
<body>
<div class="hero-orbit">
  <div class="orbit-ring">
    <div class="orbit-icon" style="--a: 0deg; --r: 300px;">1</div>
    <div class="orbit-icon" style="--a: 90deg; --r: 300px;">2</div>
  </div>
</div>
</body>
</html>
